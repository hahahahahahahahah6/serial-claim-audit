[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "serial-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented wired port claims"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
serial-claim-audit = "serial_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["serial_claim_audit*"]
